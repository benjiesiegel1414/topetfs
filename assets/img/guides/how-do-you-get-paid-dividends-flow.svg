<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7c6bb5"/></marker></defs>
<rect width="800" height="900" rx="20" fill="#f7f6fb"/>
<text x="40" y="66" font-size="34" font-weight="800" fill="#231d2d">How a dividend gets to you</text>
<text x="40" y="102" font-size="20" fill="#5b5670">It moves on its own. You only choose the end.</text>
<rect x="40" y="135" width="335" height="140" rx="16" fill="#fff" stroke="#d9d4ea" stroke-width="2"/>
<text x="207" y="190" text-anchor="middle" font-size="18" font-weight="800" fill="#7c6bb5" letter-spacing="1.5">STEP 1</text>
<text x="207" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#231d2d">Companies</text>
<text x="207" y="256" text-anchor="middle" font-size="19" fill="#5b5670">pay dividends</text>
<line x1="381" y1="205" x2="410" y2="205" stroke="#7c6bb5" stroke-width="4" marker-end="url(#a)"/>
<rect x="425" y="135" width="335" height="140" rx="16" fill="#fff" stroke="#d9d4ea" stroke-width="2"/>
<text x="592" y="190" text-anchor="middle" font-size="18" font-weight="800" fill="#7c6bb5" letter-spacing="1.5">STEP 2</text>
<text x="592" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#231d2d">The ETF</text>
<text x="592" y="256" text-anchor="middle" font-size="19" fill="#5b5670">collects and passes them on</text>
<line x1="592" y1="281" x2="592" y2="318" stroke="#7c6bb5" stroke-width="4" marker-end="url(#a)"/>
<rect x="40" y="335" width="720" height="150" rx="18" fill="#231d2d"/>
<text x="400" y="385" text-anchor="middle" font-size="18" font-weight="800" fill="#c4b5fd" letter-spacing="2">STEP 3: ON THE PAY DATE</text>
<text x="400" y="428" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Cash lands in your brokerage</text>
<text x="400" y="464" text-anchor="middle" font-size="21" fill="#d8d2ea">account or IRA. No form, nothing to claim.</text>
<line x1="220" y1="491" x2="220" y2="528" stroke="#7c6bb5" stroke-width="4" marker-end="url(#a)"/>
<line x1="580" y1="491" x2="580" y2="528" stroke="#7c6bb5" stroke-width="4" marker-end="url(#a)"/>
<rect x="40" y="545" width="345" height="160" rx="16" fill="#fff" stroke="#16a34a" stroke-width="3"/>
<text x="64" y="590" font-size="18" font-weight="800" fill="#16a34a" letter-spacing="1.2">OPTION A: REINVEST</text>
<text x="64" y="630" font-size="22" font-weight="700" fill="#231d2d">Buys more shares</text>
<text x="64" y="660" font-size="19" fill="#5b5670">(DRIP), often fractional</text>
<text x="64" y="686" font-size="19" fill="#5b5670">ones. Compounds for you.</text>
<rect x="415" y="545" width="345" height="160" rx="16" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="439" y="590" font-size="18" font-weight="800" fill="#2563eb" letter-spacing="1.2">OPTION B: KEEP CASH</text>
<text x="439" y="630" font-size="22" font-weight="700" fill="#231d2d">Sits in your cash</text>
<text x="439" y="660" font-size="19" fill="#5b5670">balance until you invest</text>
<text x="439" y="686" font-size="19" fill="#5b5670">it or move it out.</text>
<line x1="587" y1="711" x2="587" y2="748" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
<rect x="415" y="765" width="345" height="70" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="587" y="808" text-anchor="middle" font-size="21" font-weight="800" fill="#1e3a8a">Transfer it to your bank</text>
<text x="40" y="790" font-size="19" fill="#5b5670">The only rule: own the</text>
<text x="40" y="816" font-size="19" fill="#5b5670">shares before the</text>
<text x="40" y="842" font-size="19" fill="#5b5670">ex-dividend date.</text>
<text x="40" y="880" font-size="16" fill="#9a95ad">TopETFs.com</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
