<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="800" height="760" rx="20" fill="#f7f6fb"/>
<text x="40" y="66" font-size="32" font-weight="800" fill="#231d2d">What it looks like in your account</text>
<text x="40" y="100" font-size="19" fill="#5b5670">Example activity on a pay date. Labels vary by broker.</text>
<rect x="30" y="125" width="740" height="545" rx="18" fill="#fff" stroke="#e2deef" stroke-width="2"/>
<text x="60" y="172" font-size="16" font-weight="800" fill="#7a7590" letter-spacing="1.5">ACCOUNT ACTIVITY</text>
<text x="740" y="172" text-anchor="end" font-size="16" font-weight="800" fill="#7a7590" letter-spacing="1.5">AMOUNT</text>
<line x1="60" y1="190" x2="740" y2="190" stroke="#eceaf3" stroke-width="2"/>
<rect x="60" y="212" width="126" height="34" rx="17" fill="#ecfdf5"/><text x="123" y="235" text-anchor="middle" font-size="15" font-weight="800" fill="#047857">DIVIDEND</text>
<text x="740" y="238" text-anchor="end" font-size="28" font-weight="800" fill="#047857">+$30.00</text>
<text x="60" y="284" font-size="23" font-weight="700" fill="#231d2d">Dividend received</text>
<text x="60" y="314" font-size="18" fill="#7a7590">120 shares x $0.25 per share</text>
<line x1="60" y1="340" x2="740" y2="340" stroke="#eceaf3" stroke-width="2"/>
<rect x="60" y="362" width="126" height="34" rx="17" fill="#fff7ed"/><text x="123" y="385" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">TAX</text>
<text x="740" y="388" text-anchor="end" font-size="28" font-weight="800" fill="#b45309">-$0.45</text>
<text x="60" y="434" font-size="23" font-weight="700" fill="#231d2d">Foreign tax withheld</text>
<text x="60" y="464" font-size="18" fill="#7a7590">Only on some funds with international stocks</text>
<line x1="60" y1="490" x2="740" y2="490" stroke="#eceaf3" stroke-width="2"/>
<rect x="60" y="512" width="126" height="34" rx="17" fill="#f5f3ff"/><text x="123" y="535" text-anchor="middle" font-size="15" font-weight="800" fill="#5b4b9a">REINVEST</text>
<text x="740" y="538" text-anchor="end" font-size="28" font-weight="800" fill="#231d2d">-$29.55</text>
<text x="60" y="584" font-size="23" font-weight="700" fill="#231d2d">Bought 0.270 shares</text>
<text x="60" y="614" font-size="18" fill="#7a7590">Only if dividend reinvestment (DRIP) is on</text>
<line x1="60" y1="640" x2="740" y2="640" stroke="#eceaf3" stroke-width="2"/>
<text x="40" y="706" font-size="18" fill="#5b5670">With cash selected, the $29.55 stays in your cash balance.</text>
<text x="40" y="740" font-size="16" fill="#9a95ad">TopETFs.com  ·  Hypothetical example, not a real account</text>
