name: Refresh data and build site

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~7am ET
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull latest data from the network sheets
        run: |
          set -e
          fetch () {
            curl -sSL --retry 3 -m 60 "$2" -o "/tmp/$1.csv"
            if head -1 "/tmp/$1.csv" | grep -qi '^Symbol,'; then
              mv "/tmp/$1.csv" "data/$1.csv"; echo "updated $1"
            else
              echo "::warning::$1 sheet did not return CSV, keeping previous snapshot"
            fi
          }
          fetch pro    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxCiod-Cwry7E6k9Un9dgrM_ANymC36_IO_wLyNj-YDo2KI7mp_1ZzyNBnBGZOxT48QPM8TCwtsmA4/pub?gid=0&single=true&output=csv"
          fetch weekly "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1P00pQ6hNvYolxzrKYIuxC-AH1xFBpMtsn-NwC17W4vQazk3ql69ZmSmW8J-jp7OaUmKLV5v2KPI3/pub?gid=0&single=true&output=csv"
          fetch growth "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgB3eBiOxZ6CoBjVvi9Rm3PmJDssWCsHWuVG4YgCPnXLG02u0tQxoR055J-e21MYbXJES1UpPTy7h9/pub?gid=0&single=true&output=csv"
      - name: Build
        run: node scripts/build.mjs
      - name: Commit
        run: |
          git config user.name "topetfs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily data refresh and rebuild [skip ci]"
          git push
