name: Daily article

on:
  schedule:
    - cron: "7 12 * * *"   # every day ~8am ET
  workflow_dispatch:
    inputs:
      force:
        description: "Write another article even if one already went out today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull latest data from the network sheets
        run: |
          set -e
          fetch () {
            curl -sSL --retry 3 -m 60 "$2" -o "/tmp/$1.csv"
            if head -1 "/tmp/$1.csv" | grep -qi '^Symbol,'; then mv "/tmp/$1.csv" "data/$1.csv"; echo "updated $1"; else echo "::warning::$1 sheet did not return CSV, keeping previous snapshot"; fi
          }
          fetch pro    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxCiod-Cwry7E6k9Un9dgrM_ANymC36_IO_wLyNj-YDo2KI7mp_1ZzyNBnBGZOxT48QPM8TCwtsmA4/pub?gid=0&single=true&output=csv"
          fetch weekly "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1P00pQ6hNvYolxzrKYIuxC-AH1xFBpMtsn-NwC17W4vQazk3ql69ZmSmW8J-jp7OaUmKLV5v2KPI3/pub?gid=0&single=true&output=csv"
          fetch growth "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgB3eBiOxZ6CoBjVvi9Rm3PmJDssWCsHWuVG4YgCPnXLG02u0tQxoR055J-e21MYbXJES1UpPTy7h9/pub?gid=0&single=true&output=csv"
      - name: Seed topic queue (first run only)
        run: node scripts/seed-topics.mjs
      - name: Write today's article with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node scripts/write-article.mjs ${{ inputs.force && '--force' || '' }}
      - name: Build site
        run: node scripts/build.mjs
      - name: Commit and push
        run: |
          git config user.name "topetfs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if [ -f .new-article-url ]; then MSG="New article: $(basename $(cat .new-article-url)) [skip ci]"; else MSG="Daily article run [skip ci]"; fi
          git rm -q --cached .new-article-url 2>/dev/null || true
          git commit -m "$MSG"
          git push
      - name: Ping search engines (IndexNow + sitemap)
        if: always()
        run: |
          [ -f .new-article-url ] || exit 0
          URL=$(cat .new-article-url)
          sleep 90   # give GitHub Pages time to publish
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"topetfs.com\",\"key\":\"0cfadbd6b0e93fdb783aaccafc907e0a\",\"keyLocation\":\"https://topetfs.com/0cfadbd6b0e93fdb783aaccafc907e0a.txt\",\"urlList\":[\"$URL\",\"https://topetfs.com/\",\"https://topetfs.com/latest\",\"https://topetfs.com/sitemap.xml\"]}"
          echo "Published $URL"
